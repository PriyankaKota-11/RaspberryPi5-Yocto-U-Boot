# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-priyanka"
BBFILE_PATTERN_meta-priyanka = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-priyanka = "6"

LAYERDEPENDS_meta-priyanka = "core"
LAYERSERIES_COMPAT_meta-priyanka = "scarthgap"
